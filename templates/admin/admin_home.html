<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | EarthScape Climate Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    :root {
      --black: #0D0D0D;
      --black-2: #1A1A1A;
      --gold: #F2A900;
      --gold-hover: #FFC229;
      --white: #FFFFFF;
      --silver: #B0B0B0;
      --dark-gray: #2B2B2B;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(242,169,0,0.13), transparent 24%),
        linear-gradient(180deg, var(--black) 0%, #121212 100%);
      color: var(--white);
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .main-content-wrapper {
        margin-left: 0;
        padding: 15px;
      }
    }

    .card {
      background: linear-gradient(180deg, rgba(42,42,42,0.98), rgba(26,26,26,0.98));
      border: 1px solid rgba(242,169,0,0.14);
      border-radius: 18px;
      color: var(--white);
      box-shadow: 0 20px 45px rgba(242,169,0,0.08);
    }

    .card h6 {
      font-size: 15px;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--silver);
    }

    .card h4 {
      font-size: 22px;
      font-weight: 700;
    }

    .card i {
      color: var(--gold);
    }

    hr {
      border-color: rgba(176,176,176,0.2);
    }

    canvas {
      background-color: rgba(26,26,26,0.9);
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="main-content-wrapper mt-3">
    <h2 class="mb-4">Dashboard Overview</h2>

    <!-- Stat Cards -->
    <div class="row g-4">
      <div class="col-md-6 col-lg-3">
        <div class="card p-3">
          <h6>Total Users</h6>
          <h4><i class="fas fa-users me-2"></i> <span class="counter" data-count="125">0</span></h4>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card p-3">
          <h6>Climate Records</h6>
          <h4><i class="fas fa-database me-2"></i> <span class="counter" data-count="980">0</span></h4>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card p-3">
          <h6>Active Alerts</h6>
          <h4><i class="fas fa-bell me-2"></i> <span class="counter" data-count="23">0</span></h4>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card p-3">
          <h6>Feedback Received</h6>
          <h4><i class="fas fa-comment-alt me-2"></i> <span class="counter" data-count="47">0</span></h4>
        </div>
      </div>
    </div>

    <hr class="my-4 border-light">

    <!-- Charts -->
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-3">
          <h6>Temperature Over Time</h6>
          <canvas id="lineChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6>Rainfall, Humidity & Wind</h6>
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6>Weather Composition</h6>
          <canvas id="pieChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6>Model Prediction Output</h6>
          <canvas id="modelChart"></canvas>
        </div>
      </div>
    </div>
  </div>


</body>
</html>
