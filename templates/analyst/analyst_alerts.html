<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Climate Alerts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --black: #0D0D0D;
      --black-2: #1A1A1A;
      --gold: #F2A900;
      --gold-hover: #FFC229;
      --white: #FFFFFF;
      --silver: #B0B0B0;
      --dark-gray: #2B2B2B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(242,169,0,0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(176,176,176,0.06), transparent 30%),
        linear-gradient(180deg, var(--black) 0%, #121212 100%);
      color: var(--white);
      font-family: 'Inter', sans-serif;
    }

    .container {
      max-width: 980px;
      padding-top: 56px;
      padding-bottom: 56px;
    }

    h2 {
      color: var(--white);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 28px;
    }

    h2 .accent {
      color: var(--gold);
    }

    .card {
      background: linear-gradient(180deg, rgba(42,42,42,0.98), rgba(26,26,26,0.98));
      border: 1px solid rgba(242,169,0,0.18);
      border-left: 5px solid var(--gold);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 18px;
      box-shadow: 0 18px 40px rgba(242,169,0,0.08);
    }

    ul {
      margin: 0;
      padding-left: 0;
      display: grid;
      gap: 8px;
    }

    li {
      list-style: none;
      color: var(--white);
      background: rgba(176,176,176,0.04);
      border: 1px solid rgba(242,169,0,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      line-height: 1.5;
      font-size: 15px;
    }

    li.temp {
      box-shadow: inset 2px 0 0 var(--gold);
    }

    li.humidity {
      box-shadow: inset 2px 0 0 var(--silver);
    }

    li.rain {
      box-shadow: inset 2px 0 0 var(--gold-hover);
    }

    .no-alert {
      text-align: center;
      padding: 42px 24px;
      border-radius: 18px;
      font-size: 18px;
      color: var(--silver);
      background: rgba(26,26,26,0.9);
      border: 1px solid rgba(242,169,0,0.18);
      box-shadow: 0 18px 40px rgba(242,169,0,0.08);
    }

    .timestamp {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--silver);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Recent <span class="accent">Climate Alerts</span></h2>
    <div id="alertListContainer"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function () {
      $.get('/analyst/get-alerts', function (data) {
        const container = $('#alertListContainer');

        if (data.success && data.alerts.length > 0) {
          data.alerts.forEach(entry => {
            const time = new Date(entry.timestamp).toLocaleString();
            const alertList = entry.alerts.map(alert => {
              let cls = '';
              if (alert.toLowerCase().includes('temperature')) cls = 'temp';
              else if (alert.toLowerCase().includes('humidity')) cls = 'humidity';
              else if (alert.toLowerCase().includes('rainfall')) cls = 'rain';
              return `<li class="${cls} text-white">${alert}</li>`;
            }).join('');

            const card = `
              <div class="card">
                <div class="timestamp">${time} ${entry.username ? ` | ${entry.username}` : ''}</div>
                <ul>${alertList}</ul>
              </div>`;
            container.append(card);
          });
        } else {
          container.html('<div class="no-alert">No climate alerts found. Everything looks good.</div>');
        }
      });
    });
  </script>
</body>
</html>
