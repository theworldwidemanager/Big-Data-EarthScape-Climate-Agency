<style>
  :root {
    --black: #0D0D0D;
    --black-2: #1A1A1A;
    --gold: #F2A900;
    --gold-hover: #FFC229;
    --white: #FFFFFF;
    --silver: #B0B0B0;
    --dark-gray: #2B2B2B;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top right, rgba(242,169,0,0.14), transparent 20%),
      linear-gradient(180deg, var(--black) 0%, #121212 100%);
    color: var(--white);
    font-family: 'Inter', sans-serif;
  }

  .profile-wrap {
    max-width: 800px;
    margin: 48px auto 0;
    background: linear-gradient(180deg, rgba(42,42,42,0.98), rgba(26,26,26,0.98));
    border: 1px solid rgba(242,169,0,0.18);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(242,169,0,0.12);
    overflow: hidden;
  }

  .card-body {
    padding: 38px 32px !important;
  }

  .profile-title {
    color: var(--white) !important;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .profile-title .accent {
    color: var(--gold);
  }

  .form-label {
    color: var(--silver);
    font-weight: 600;
  }

  .form-control {
    background: rgba(18,18,18,0.9);
    border: 1px solid rgba(242,169,0,0.18);
    color: var(--white);
    border-radius: 12px;
  }

  .form-control:focus {
    background: rgba(18,18,18,0.9);
    border-color: rgba(242,169,0,0.8);
    box-shadow: 0 0 0 4px rgba(242,169,0,0.12);
    color: var(--white);
  }

  .btn-success {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-hover) 100%) !important;
    border: none !important;
    color: #0D0D0D !important;
    font-weight: 700;
    box-shadow: 0 16px 30px rgba(242,169,0,0.18);
  }

  #preview-img {
    border: 2px solid rgba(242,169,0,0.2);
    box-shadow: 0 18px 30px rgba(242,169,0,0.08);
  }
</style>

<div class="container-fluid mt-5">
  <div class="profile-wrap mx-auto">
    <div class="card-body p-5">
      <h2 class="text-center mb-4 fw-bold profile-title"><span class="accent">{{ user.username or "Analyst Profile" }}</span></h2>

      <form id="profile-form" enctype="multipart/form-data">
        <!-- Profile Image -->
        <div class="mb-4 text-center">
          <img id="preview-img" src="{{ user.profile_img or '/static/default.jpg' }}" 
               class="rounded-circle shadow-sm border border-light" 
               alt="Profile" width="130" height="130" style="object-fit: cover;">
          <input type="file" name="profile_img" class="form-control mt-3 bg-dark text-light w-50 mx-auto" onchange="previewImage(this)">
        </div>

        <!-- Username & Email (Row) -->
        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control bg-dark text-light" value="{{ user.username or '' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control bg-dark text-light" value="{{ user.email or '' }}" required>
          </div>
        </div>

        <!-- Bio -->
        <div class="mb-4">
          <label class="form-label">Bio</label>
          <textarea name="bio" class="form-control bg-dark text-light" rows="4" placeholder="Write something about yourself...">{{ user.bio or '' }}</textarea>
        </div>

        <!-- Button -->
        <div class="text-center">
          <button type="submit" class="btn btn-success px-5 py-2 fs-6 shadow">
            <i class="fas fa-save me-2"></i>{{ 'Update Profile' if user.username else 'Create Profile' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function previewImage(input) {
  const file = input.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      document.getElementById('preview-img').src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

document.getElementById("profile-form").addEventListener("submit", function(e){
  e.preventDefault();

  const formData = new FormData(this);

  fetch('/analyst/profile/update', {
    method: 'POST',
    body: formData
  }).then(res => res.json()).then(data => {
    if(data.status === 'success'){
      alert('Profile updated!');
      loadPage('/analyst/profile');
    } else {
      alert('Failed to save profile.');
    }
  });
});
</script>
